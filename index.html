<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAEEDA">
  <meta name="description" content="풍성한 삶으로 한 걸음씩 함께">

  <!-- 캐시 방지 (개발 단계용) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="풍성한 첫걸음">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- favicon -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <title>풍성한 삶으로 첫걸음</title>

  <!-- 폰트 (외부 CDN - 캐시 OK) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">

  <!-- 우리 CSS·JS는 매 방문마다 새로 받기 -->
  <script>
    (function() {
      var v = '?v=' + Date.now();

      // CSS 동적 추가
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'css/styles.css' + v;
      document.head.appendChild(link);

      // app.js 진입
      window.addEventListener('DOMContentLoaded', function() {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = 'js/app.js' + v;
        document.body.appendChild(script);
      });

      // Service Worker 등록 (PWA 작동)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('sw.js').catch(function(err) {
            console.warn('Service Worker 등록 실패:', err);
          });
        });
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 화면이 동적으로 여기 렌더링됨 -->
  </div>
</body>
</html>
