# 계정·동기화·모임 시험
# test/ 로 시작하는 가지에 올리거나 손으로 시작할 때만 돎 — 배포하지 않음
# Firebase 에뮬레이터(가짜 서버)에서 보안 규칙과 실제 앱 화면을 함께 시험
name: Cloud test

on:
  push:
    branches: ['test/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .github/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 시험 도구 설치
        run: |
          npm install --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10.13.2 playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 에뮬레이터에서 시험
        run: npx firebase emulators:exec --only auth,firestore --project demo-firststep "node rules.test.mjs && node e2e.mjs"

      - name: 화면 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: .github/tests/shots
          if-no-files-found: ignore
