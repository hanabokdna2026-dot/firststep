<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD3"/>
      <stop offset="100%" stop-color="#F2D8A8"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F5B945"/>
      <stop offset="100%" stop-color="#D08820"/>
    </radialGradient>
  </defs>

  <!-- 둥근 사각 배경 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- 해 (산 봉우리 살짝 너머에서 떠오르는 결) -->
  <circle cx="256" cy="270" r="78" fill="url(#sunGrad)"/>

  <!-- 해 둘레 옅은 빛 -->
  <circle cx="256" cy="270" r="100" fill="none" stroke="#EF9F27" stroke-width="1.5" opacity="0.28"/>
  <circle cx="256" cy="270" r="124" fill="none" stroke="#EF9F27" stroke-width="1" opacity="0.16"/>

  <!-- 뒷산 (옅게) -->
  <path d="M 0,420 L 180,310 L 360,360 L 512,300 L 512,512 L 0,512 Z"
        fill="#BA7517" opacity="0.28"/>

  <!-- 앞산 — 두 봉우리. 큰 산이 해의 일부를 가리도록 -->
  <path d="M 0,470 L 130,380 L 240,420 L 360,295 L 512,445 L 512,512 L 0,512 Z"
        fill="#854F0B"/>
</svg>
